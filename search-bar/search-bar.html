<script>
(function () {
  function init() {
    if (document.getElementById('floating-site-search')) return;

    var font = document.createElement('link');
    font.rel = 'stylesheet';
    font.href = 'https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap';
    document.head.appendChild(font);

    var style = document.createElement('style');
    style.textContent = `
      #floating-site-search{position:fixed;top:130px;right:20px;z-index:999999;width:min(325px,calc(100vw - 40px));font-family:Poppins,Arial,sans-serif;color:#1e293b}
      #floating-site-search .input-container{position:relative}
      #floating-site-search input {box-sizing: border-box;width: 100%;padding: 14px 44px;font: 15px Poppins, Arial, sans-serif;color: #0f172a;background: rgba(255, 255, 255, 0.58);border: 1px solid rgba(255, 255, 255, 0.7);border-radius: 14px;outline: 0;backdrop-filter: blur(16px) saturate(150%);-webkit-backdrop-filter: blur(16px) saturate(150%);box-shadow:0 8px 24px rgba(15, 23, 42, 0.12),inset 0 1px 0 rgba(255, 255, 255, 0.8);}
      #floating-site-search input:focus{border-color:rgba(0,61,124,.6);box-shadow:0 0 0 4px rgba(0,61,124,.08),0 12px 30px rgba(0,0,0,.08)}
      #floating-site-search .icon {display: block;position: absolute;left: 15px;top: 50%;z-index: 5;width: 15px;height: 15px;transform: translateY(-55%);box-sizing: border-box;border: 2px solid #2563eb;border-radius: 50%;background: #dbeafe;pointer-events: none;}
      #floating-site-search .icon::after {content: "";display: block;position: absolute;right: -6px;bottom: -4px;width: 8px;height: 2px;background: #9333ea;border-radius: 2px;transform: rotate(45deg);transform-origin: left center;}
      #floating-site-search .menu {display: none;position: absolute;top: calc(100% + 10px);left: 0;right: 0;max-height: 380px;overflow: auto;padding: 8px;background: rgba(255, 255, 255, 0.62);border: 1px solid rgba(255, 255, 255, 0.7);border-radius: 16px;backdrop-filter: blur(16px) saturate(150%);-webkit-backdrop-filter: blur(16px) saturate(150%);box-shadow: 0 20px 40px rgba(15, 23, 42, 0.16);}
      #floating-site-search .title{padding:10px 12px 6px;font-size:11px;font-weight:700;letter-spacing:.08em;color:#475569;text-transform:uppercase}
      #floating-site-search .item{padding:11px 14px;margin-bottom:3px;border-radius:10px;cursor:pointer}
      #floating-site-search .item:hover{background:#f1f5f9}
      #floating-site-search .item-title{font-weight:600;color:#0f172a}
      #floating-site-search .item-text{margin-top:3px;font-size:13px;line-height:1.45;color:#475569}
      #floating-site-search .empty{padding:24px 14px;text-align:center;color:#64748b}
      @media(max-width:600px){#floating-site-search{top:10px;right:10px;left:10px;width:auto}}
    `;
    document.head.appendChild(style);

    var root = document.createElement('div');
    root.id = 'floating-site-search';
    root.innerHTML = '<div class="input-container"><span class="icon" aria-hidden="true"></span><input type="text" placeholder="Search" autocomplete="off"><div class="menu"></div></div>';
    document.body.appendChild(root);

    var input = root.querySelector('input');
    var menu = root.querySelector('.menu');
    var pages = [];

    fetch('https://raw.githubusercontent.com/henghengyh/nus-cfa-artcyclopedia/main/search-index.json')
      .then(function (r) { return r.ok ? r.json() : []; })
      .then(function (data) { pages = Array.isArray(data) ? data : []; })
      .catch(function () { pages = []; });

    function showResults() {
      var query = input.value.trim().toLowerCase();
      menu.innerHTML = '';
      if (!query) { menu.style.display = 'none'; return; }
      var matches = pages.filter(function (page) {
        return String(page.title || '').toLowerCase().includes(query) || String(page.content || '').toLowerCase().includes(query);
      });
      menu.style.display = 'block';
      if (!matches.length) { menu.innerHTML = '<div class="empty">No matching keywords found on site.</div>'; return; }
      menu.innerHTML = '<div class="title">Search results</div>';
      matches.forEach(function (page) {
        var item = document.createElement('div');
        item.className = 'item';
        item.innerHTML = '<div class="item-title">📄 ' + String(page.title || '') + '</div><div class="item-text">' + String(page.content || '').slice(0,120) + '</div>';
        item.onclick = function () {
          var url = String(page.url || '');
          if (url.startsWith('/')) url = window.location.origin + url;
          else if (!/^https?:\/\//.test(url)) url = window.location.origin + '/' + url;
          if (url) window.location.href = url;
        };
        menu.appendChild(item);
      });
    }
    input.addEventListener('input', showResults);
    document.addEventListener('click', function (e) { if (!root.contains(e.target)) menu.style.display = 'none'; });
  }
  if (document.body) init(); else document.addEventListener('DOMContentLoaded', init, { once: true });
}());
</script>
