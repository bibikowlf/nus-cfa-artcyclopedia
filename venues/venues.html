<html lang="en">

    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>NUS artcyclopedia · Venues</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap"

    <style>
      :root {
        --ink: #23306b;
        --pink: #ff5fa2;
        --sky: #4fc3ff;
        --sun: #ffe14d;
        --mint: #6fe3c1;
        --font-body: "Inter", "Segoe UI", sans-serif;
        --font-heading: "Poppins", "Segoe UI", sans-serif;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
      }
      *,
      *:before,
      *:after {
        box-sizing: inherit;
      }
      body {
        margin: 0;
        background: transparent;
        color: var(--ink);
        font-family: var(--font-body);
        font-weight: 500;
      }
      .wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 20px 50px 60px;
      }
      .photo-disclaimer {
        margin: 30px 0 0;
        font-size: 16px;
      }
      .logo {
        font-family: var(--font-heading);
        font-size: clamp(20px, 5vw, 34px);
        line-height: 1;
        transform: none;
        display: inline-flex;
        flex-direction: column;
        margin-bottom: 24px;
        filter: none;
        letter-spacing: -0.04em;
      }
      .logo b,
      .logo i {
        font-weight: 700;
        font-style: normal;
        -webkit-text-stroke: 0;
        paint-order: normal;
      }
      .logo b {
        color: var(--sun);
        font-size: 1.6em;
      }
      .logo i {
        color: var(--pink);
      }
      h2,
      h3 {
        font-family: var(--font-heading);
        font-weight: 700;
        margin: 0;
        letter-spacing: -0.03em;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 3px solid var(--pink);
        outline-offset: 3px;
      }

      .grid {
        display: grid;
        gap: 18px;
      }
      .venues {
        grid-template-columns: repeat(3, 1fr);
      }
      .places {
        grid-template-columns: repeat(6, 1fr);
        gap: 8px;
      }
      @media (max-width: 820px) {
        .venues {
          grid-template-columns: repeat(2, 1fr);
        }
        .places {
          grid-template-columns: repeat(4, 1fr);
        }
      }
      @media (max-width: 520px) {
        .venues {
          grid-template-columns: 1fr;
        }
        .places {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      .card {
        display: flex;
        flex-direction: column;
        font: inherit;
        color: var(--ink);
        text-align: left;
        padding: 0;
        background: #fff;
        border: 4px solid var(--ink);
        border-radius: 22px;
        overflow: hidden;
        cursor: pointer;
        box-shadow: 6px 6px 0 var(--mint);
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }
      .card:hover {
        transform: translate(-2px, -3px);
        box-shadow: 8px 9px 0 var(--mint);
      }
      .card[aria-expanded="true"] {
        background: #fff;
        box-shadow: 6px 6px 0 var(--pink);
      }
      .cover {
        aspect-ratio: 4/3;
        flex: none;
        position: relative;
        display: grid;
        place-items: center;
        background: #d1d5db;
        overflow: hidden;
      }
      .unavailable {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: #d1d5db;
        color: #4b5563;
        font-size: 18px;
        font-weight: 700;
      }
      .cover img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scale(1.15);
        display: block;
      }
      .card h2 {
        flex: 1;
        font-family: var(--font-heading);
        font-size: clamp(16px, 2.4vw, 20px);
        padding: 12px 14px 2px;
      }
      .card small {
        display: block;
        padding: 0 14px 12px;
        font-weight: 700;
        opacity: 0.75;
      }

      .place {
        font: inherit;
        font-size: 13px;
        color: var(--ink);
        cursor: pointer;
        background: #fff;
        border: 2px solid var(--ink);
        border-radius: 12px;
        padding: 8px 4px;
        text-align: center;
        box-shadow: 3px 3px 0 var(--sky);
        transition: transform 0.2s;
      }
      .place:hover {
        transform: translateY(-3px);
      }
      .place[aria-expanded="true"] {
        background: #fff;
        color: var(--ink);
        box-shadow: 4px 4px 0 var(--ink);
      }
      .place b {
        display: block;
        font-family: var(--font-heading);
        font-weight: 700;
        font-size: 13px;
        line-height: 1.2;
        white-space: pre-line;
      }

      .panel {
        grid-column: 1/-1;
        position: relative;
        z-index: 1;
        background: #fff;
        border: 4px solid var(--ink);
        border-radius: 26px;
        padding: 20px;
        margin: 6px 0 10px;
        box-shadow: 8px 8px 0 var(--pink);
        animation: open 0.35s cubic-bezier(0.2, 1.2, 0.4, 1);
      }
      .panel.sub {
        border-radius: 20px;
        box-shadow: 6px 6px 0 var(--sky);
        background: #fff;
      }
      @keyframes open {
        from {
          opacity: 0;
          transform: translateY(-14px) scale(0.98);
        }
      }
      .panel:before {
        content: "";
        position: absolute;
        top: -16px;
        left: calc((var(--col) + 0.5) / var(--cols) * 100%);
        width: 26px;
        height: 26px;
        background: inherit;
        border: 4px solid var(--ink);
        border-right: 0;
        border-bottom: 0;
        transform: translateX(-50%) rotate(45deg);
        border-radius: 6px 0 0 0;
      }
      .close {
        position: absolute;
        top: 12px;
        right: 12px;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 3px solid var(--ink);
        background: var(--sun);
        font: 700 18px/1 inherit;
        color: var(--ink);
        cursor: pointer;
        z-index: 20;
      }

      h3.t {
        font-size: clamp(20px, 3.4vw, 28px);
        color: var(--pink);
        -webkit-text-stroke: 2px var(--ink);
        paint-order: stroke fill;
      }
      .tabs {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 3;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        background: #fff;
        margin: -4px 0 14px;
        padding: 4px 46px 12px 0;
        border-bottom: 3px dashed var(--sky);
      }
      .tabs .lbl {
        font-weight: 700;
        font-size: 13px;
        opacity: 0.7;
        margin-right: 2px;
      }
      .tab {
        font: inherit;
        font-weight: 700;
        color: var(--ink);
        background: #fff;
        border: 3px solid var(--ink);
        border-radius: 99px;
        padding: 5px 16px;
        cursor: pointer;
      }
      .tab[aria-current="true"] {
        background: var(--sun);
        box-shadow: 3px 3px 0 var(--pink);
      }
      .vinfo {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px 14px;
        margin-bottom: 14px;
      }
      .vinfo p {
        margin: 0;
        font-weight: 700;
      }
      .vnote {
        background: #fff8d6;
        border: 2px solid var(--ink);
        border-radius: 14px;
        margin-bottom: 16px;
        font-size: 14px;
        overflow: hidden;
      }
      .vnote summary {
        list-style: none;
        cursor: pointer;
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 10px 14px;
        font-weight: 700;
      }
      .vnote summary::-webkit-details-marker {
        display: none;
      }
      .vnote summary .ic {
        font-size: 18px;
      }
      .vnote summary .car {
        margin-left: auto;
        transition: transform 0.2s;
      }
      .vnote[open] summary .car {
        transform: rotate(180deg);
      }
      .vnote .body {
        padding: 0 14px 14px;
        display: grid;
        gap: 10px;
        overflow-wrap: anywhere;
        word-break: break-word;
      }
      .vnote .body p {
        margin: 0;
        line-height: 1.5;
        overflow-wrap: anywhere;
        word-break: break-word;
        white-space: pre-line;
      }
      .vnote .body a {
        color: var(--ink);
        font-weight: 700;
        text-decoration-color: var(--pink);
        text-decoration-thickness: 2px;
        text-underline-offset: 3px;
        overflow-wrap: anywhere;
        word-break: break-word;
      }
      .grp {
        margin-bottom: 16px;
      }
      .grp:last-child {
        margin-bottom: 0;
      }
      .grp h4 {
        margin: 0 0 8px;
        font-family: var(--font-heading);
        font-weight: 700;
        font-size: 14px;
        color: var(--pink);
      }
      .overlay {
        position: fixed;
        inset: 0;
        z-index: 10;
        background: rgba(35, 48, 107, 0.55);
        display: grid;
        place-items: center;
        padding: 20px;
        animation: fadein 0.2s;
      }
      @keyframes fadein {
        from {
          opacity: 0;
        }
      }
      .overlay .panel.sub {
        position: relative;
        max-width: 480px;
        width: 100%;
        max-height: min(84vh, 640px);
        overflow: auto;
        scrollbar-width: none;
        -ms-overflow-style: none;
        margin: 0;
        padding: 20px 22px;
        border-radius: 24px;
        box-shadow: 8px 8px 0 var(--pink);
        animation: pop 0.25s cubic-bezier(0.3, 1.4, 0.4, 1);
      }
      .overlay .panel.sub::-webkit-scrollbar {
        display: none;
      }
      .overlay .panel.sub:before {
        display: none;
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: scale(0.9) translateY(10px);
        }
      }
      .ph {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        padding-right: 44px;
        margin-bottom: 6px;
      }
      .ph .t {
        white-space: pre-line;
      }
      .ph small {
        font-weight: 700;
        opacity: 0.7;
      }
      .dl {
        display: grid;
        grid-template-columns: 104px 1fr;
        margin: 0;
      }
      .dl dt,
      .dl dd {
        padding: 10px 0;
        border-top: 2px dashed #c9d3f5;
        margin: 0;
      }
      .dl dt {
        font-weight: 700;
        color: var(--pink);
        font-size: 14px;
      }
      .dl dd {
        font-size: 15px;
        white-space: pre-line;
      }
      .dl dd a {
        color: var(--ink);
        font-weight: 700;
        text-decoration: underline;
        text-decoration-color: var(--pink);
        text-decoration-thickness: 2px;
        text-underline-offset: 3px;
      }
      .pshot {
        width: 100%;
        aspect-ratio: 16/9;
        position: relative;
        border: 3px solid var(--ink);
        border-radius: 14px;
        overflow: hidden;
        margin-bottom: 12px;
        background: #d1d5db;
        display: grid;
        place-items: center;
      }
      .pshot img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .hours {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .hours li {
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }
      .book {
        display: inline-block;
        margin-top: 8px;
        text-decoration: none;
        font-weight: 700;
        color: #fff;
        background: var(--pink);
        border: 3px solid var(--ink);
        border-radius: 99px;
        padding: 6px 16px;
        box-shadow: 3px 3px 0 var(--ink);
      }
      @media (max-width: 520px) {
        .dl {
          grid-template-columns: 88px 1fr;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>

    ];
                                                                                                        const clustersData = [
{ cluster: "Central Library", notes: "For more information, visit [Central Library website](https://nus.edu.sg/nuslibraries/spaces/our-libraries/central-library). Visit [Space Availability - Central Library](https://nus.libcal.com/spaces?lid=7406&gid=0&c=0) to book spaces. Refer to Terms & Conditions in the venue details and adhere to them. Bookings must be made at least 2 weeks before the event but no more than 2 months in advance.", image: "https://raw.githubusercontent.com/henghengyh/nus-cfa-artcyclopedia/main/photos/venue/clb.jpg" },
{ cluster: "C J Koh Law Library", notes: "For more information, visit [C J Koh Library website](https://nus.edu.sg/nuslibraries/spaces/our-libraries/c-j-koh-law-library). Visit [Space Availability - C J Koh Law Library](https://nus.libcal.com/spaces?lid=7420) to book spaces. Refer to Terms & Conditions in the venue details and adhere to them. Bookings must be made at least 2 weeks before the event but no more than 2 months in advance.", image: "https://raw.githubusercontent.com/henghengyh/nus-cfa-artcyclopedia/main/photos/venue/cjkoh-law-library.jpg" },
{ cluster: "Medicine+Science Library", notes: "For more information, visit [Medicine+Science Library website](https://nus.edu.sg/nuslibraries/spaces/our-libraries/medicine-science-library). Visit [Space Availability - Medicine+Science Library](https://nus.libcal.com/spaces?lid=7407) to book spaces. Refer to Terms & Conditions in the venue details and adhere to them. Bookings must be made at least 2 weeks before the event but no more than 2 months in advance.", image: "https://raw.githubusercontent.com/henghengyh/nus-cfa-artcyclopedia/main/photos/venue/medsci-library.jpg" },
{ cluster: "Shaw Foundation Alumni House", notes: "Visit [UCI website](https://uci.nus.edu.sg/campus-life/campus-services/sfah/availability-and-enquiry/) for venue listing. A minimum booking duration of 4 hours is required.", image: "https://raw.githubusercontent.com/henghengyh/nus-cfa-artcyclopedia/main/photos/venue/shaw-foundation-alumni.jpg" },
{ cluster: "University Cultural Centre", notes: "Visit [UCC website](https://uci.nus.edu.sg/campus-life/university-cultural-centre/) to view the venues available at the University Cultural Centre. For enquiries, email uccvenues@nus.edu.sg. Venues are released for booking up to a year in advance and bookings require at least 3 months' notice. Minimum booking duration is 8 continuous hours.", image: "https://raw.githubusercontent.com/henghengyh/nus-cfa-artcyclopedia/main/photos/venue/ucc.jpg" },
{ cluster: "UTown", notes: "For more information, visit [Utown website](https://uci.nus.edu.sg/campus-life/campus-services/utown/). For event bookings, please contact utown@nus.edu.sg with the UTown Booking Form available on the [UTown Facilities Booking System](https://utownfbs.nus.edu.sg/utown/apptop.aspx) and staff advisor endorsement for rental rates and booking procedures. Requests should be made in advance as the booking form has to be submitted at least one month before event setup begins. Practice rooms and studios are available at the Stephen Riady Centre for activities ranging from dance and drama practices to judo and yoga. To book a practice space for self-practice, please visit [UTown Facilities Booking System](https://utownfbs.nus.edu.sg/utown/apptop.aspx). Press the Help button in the system to access the FBS User Guide for guidelines. Bookings must be made at least 3 days in advance and can be made up to 7 days in advance. Students/staff can book practice spaces for up to 2 hours a day, with a maximum of 3 times a week. Please note that individual bookings are for self-practice or activities involving NUS staff/students only. Users are not allowed to bring in external guests/visitors. External parties interested in booking UTown facilities and/or spaces may approach the [Conferences & Events Management Unit](https://uci.nus.edu.sg/ceu/) via email at ceu@nus.edu.sg. All bookings of facilities are subject to the Terms & Conditions listed under the [Events tab](https://uci.nus.edu.sg/campus-life/campus-services/utown/facilities-booking-utown-non-residential-facilities/). For enquiries, please email utown@nus.edu.sg.", image: "https://raw.githubusercontent.com/henghengyh/nus-cfa-artcyclopedia/main/photos/venue/utown.jpg" },
{ cluster: "Yale-NUS College", notes: "Email utown@nus.edu.sg to check availability and book.", image: "https://raw.githubusercontent.com/henghengyh/nus-cfa-artcyclopedia/main/photos/venue/yale-nus.png" },
{ cluster: "Yusof Ishak House", notes: "For more information, visit [Yusof Ishak House website](https://osa.nus.edu.sg/yih/). Refer to [REBOKS User Guide for Group Representatives](https://nusync.nus.edu.sg/get_file?eid=03da6acb2dc6fbc7f45e9881b32d082a) under NUSync Resources by OSA. For special event bookings or ad hoc bookings without a REBOKS account, please write to yihvenues@nus.edu.sg and reboks@nus.edu.sg. Staff Advisor must approve the booking within 5 days of submission otherwise the booking will be auto rejected by the system. Cancellations must be done in REBOKS at least 3 days before the actual booking date.", image: "https://raw.githubusercontent.com/henghengyh/nus-cfa-artcyclopedia/main/photos/venue/yih.jpg" }
    ];
      const clusters = [
        ...new Set(venuesData.map((v) => v.cluster || "Other Venues")),
      ];
      const $ = (id) => document.getElementById(id),
        esc = (s) =>
          String(s).replace(
            /[&<>\"]/g,
            (c) =>
              ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
          );
      const renderLinkifiedText = (text) => {
        const value = String(text ?? "");
        if (!value) return "";

        const tokenPattern = /\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)|(https?:\/\/[^\s<>"']+)|([A-Z0-9._%+-]+@nus\.edu\.sg)/gi;
        let out = "";
        let lastIndex = 0;

        for (const match of value.matchAll(tokenPattern)) {
          const start = match.index;

          out += esc(value.slice(lastIndex, start));

          if (match[1] !== undefined) {
            out += `<a href="${esc(match[2])}" target="_blank" rel="noopener noreferrer">${esc(match[1])}</a>`;
          } else if (match[3] !== undefined) {
            const token = match[3];
            const trimmed = token.replace(/[.,!?;:]+$/, "");
            const trailing = token.slice(trimmed.length);
            out += `<a href="${esc(trimmed)}" target="_blank" rel="noopener noreferrer">${esc(trimmed)}</a>`;
            out += esc(trailing);
          } else {
            const token = match[4];
            out += `<a href="mailto:${esc(token)}">${esc(token)}</a>`;
          }

          lastIndex = start + match[0].length;
        }

        out += esc(value.slice(lastIndex));
        return out;
      };
      const st = { v: null, p: null };
      const img = (src, alt = "") =>
        `<span class="unavailable" role="img" aria-label="Unavailable">Unavailable</span>${src ? `<img src="${esc(src)}" alt="${esc(alt)}" onerror="this.remove()">` : ""}`;
      /* column counts mirror the CSS breakpoints */
      const vc = () => (innerWidth <= 520 ? 1 : innerWidth <= 820 ? 2 : 3),
        pc = () => (innerWidth <= 520 ? 2 : innerWidth <= 820 ? 3 : 4);

      /* items -> html with a panel inserted after the end of the selected item's row */
      function layout(items, n, sel, panelFn) {
        const rowEnd =
          sel < 0
            ? -1
            : Math.min(items.length - 1, (Math.floor(sel / n) + 1) * n - 1);
        return items
          .map((h, k) => h + (k === rowEnd ? panelFn(sel % n, n) : ""))
          .join("");
      }
      function placeBox(v) {
        return `<div class="overlay" id="ov"><section class="panel sub" id="pbox" aria-label="${esc(v.name)} details">
 <button class="close" data-close="p" aria-label="Close">✕</button>
 <div class="ph"><h3 class="t">${esc(v.name)}</h3><small>${esc(v.cluster)}</small></div>
 <div class="pshot">${img(v.image, v.name)}</div>
 <dl class="dl">
  <dt>Capacity</dt><dd>${v.capacity ? `${v.capacity} people` : "Not stated"}</dd>
  <dt>Hours</dt><dd>${esc(v.hours || "Not stated")}</dd>
  <dt>Booking</dt><dd>${renderLinkifiedText(v.booking || "Not stated")}</dd>
  <dt>Notes</dt><dd>${renderLinkifiedText(v.notes || "No additional notes.")}</dd>
 </dl></section></div>`;
      }
      function venueBox(col, n) {
        const selected = clusters[st.v];
        const entries = venuesData.filter((v) => v.cluster === selected);
        const clusterNotes = clustersData.find((item) => item.cluster === selected);
        const groups = [];

        entries.forEach((p) => {
          const sub = p.subcategory || "Spaces";
          let group = groups.find((g) => g.name === sub);
          if (!group) {
            group = { name: sub, venues: [] };
            groups.push(group);
          }
          group.venues.push(p);
        });

        let idx = 0;
        const ph = groups
          .map((group) => {
            const items = group.venues
              .map((v) => {
                const i = idx++;
                return `<button class="place" data-p="${i}" aria-expanded="${i === st.p}" aria-controls="pbox"><b>${esc(v.name)}</b></button>`;
              })
              .join("");

            return `<div class="grp"><h4>${esc(group.name)}</h4><div class="grid places">${items}</div></div>`;
          })
          .join("");

        return `<section class="panel" id="vbox" style="--col:${col};--cols:${n}" aria-label="${esc(selected)} places">
 <button class="close" data-close="v" aria-label="Close">✕</button>
       <div class="vinfo"><h3 class="t">${esc(selected)}</h3></div>
       ${clusterNotes ? `<details class="vnote"><summary><span class="ic">ℹ️</span><span>General Notes</span><span class="car">▾</span></summary><div class="body"><p>${renderLinkifiedText(clusterNotes.notes)}</p></div></details>` : ""}
 ${ph}</section>`;
      }
      function render() {
        const n = vc();
        const cards = clusters.map((clusterName, i) => {
          const entries = venuesData.filter((v) => v.cluster === clusterName);
          const clusterImage =
            clustersData.find((item) => item.cluster === clusterName)?.image ||
            "";
          return `<button class="card" data-i="${i}" aria-expanded="${i === st.v}" aria-controls="vbox"><div class="cover">${img(clusterImage)}</div><h2>${esc(clusterName)}</h2><small>${entries.length} venues</small></button>`;
        });
        $("grid").innerHTML = layout(cards, n, st.v ?? -1, (c, m) =>
          venueBox(c, m),
        );
        const currentCluster = st.v !== null ? clusters[st.v] : null;
        $("ovwrap").innerHTML =
          st.v !== null && st.p !== null && currentCluster
            ? placeBox(
                venuesData.filter((v) => v.cluster === currentCluster)[st.p],
              )
            : "";
      }
      $("grid").onclick = (e) => {
        const c = e.target.closest(".card,.tab"),
          p = e.target.closest(".place"),
          x = e.target.closest("[data-close]");
        if (x) {
          if (x.dataset.close === "p") st.p = null;
          else {
            st.v = null;
            st.p = null;
          }
        } else if (p) {
          const k = +p.dataset.p;
          st.p = st.p === k ? null : k;
        } else if (c) {
          const i = +c.dataset.i;
          st.v = st.v === i && !c.classList.contains("tab") ? null : i;
          st.p = null;
        } else return;
        render();
        if (st.p !== null) {
          requestAnimationFrame(() => {
            window.parent.postMessage({ type: "venue-popup-open" }, "*");
          });
        } else if (st.v !== null) {
          $("vbox")?.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }
      };
      $("ovwrap").onclick = (e) => {
        if (
          e.target.id === "ov" ||
          e.target.closest('.close[data-close="p"]')
        ) {
          st.p = null;
          render();
        }
      };
      document.onkeydown = (e) => {
        if (e.key === "Escape") {
          if (st.p !== null) st.p = null;
          else st.v = null;
          render();
        }
      };
      let last = vc() + "-" + pc();
      addEventListener("resize", () => {
        const k = vc() + "-" + pc();
        if (k !== last) {
          last = k;
          render();
        }
      });
      render();
    </script>
  </body>
